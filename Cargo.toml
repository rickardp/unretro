[workspace]
resolver = "2"
members = [".", "crates/unretro-python"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rickardp/unretro"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
too_many_lines = "allow"
too_many_arguments = "allow"
# In `all` for the MSRV toolchain's clippy, pedantic in later ones.
format_collect = "allow"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
crossbeam-channel = "0.5"
log = "0.4"

[package]
name = "unretro"
description = "Forward-only access to retro container formats for emulators and retro gaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["retro", "emulator", "archive", "hfs", "stuffit"]
categories = ["parser-implementations", "compression", "game-development"]
# Keep the published tarball lean: no CI configs, agent docs, dev scripts, or binary fixtures.
exclude = [
    ".github/**",
    "AGENTS.md",
    "scripts/**",
    "testdata/**",
]

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bin]]
name = "unretro"
path = "src/bin/unretro.rs"
required-features = ["std", "full"]

[[example]]
name = "list_contents"
path = "examples/list_contents.rs"
required-features = ["std"]

[features]
default = ["std", "full"]
std = [
    "thiserror/std",
    "dep:memmap2",
    "dep:xattr",
    "dep:libc",
]
no_std = []

# Public format toggles. These remain stable API.
# Backend implementation capabilities are wired internally.
common = []
xz = []
macintosh = []
# No-op: StuffIt is part of `macintosh`. Kept so existing feature lists build.
stuffit = []
amiga = []
game = []
dos = []
next = []
beos = []
lisa = []

# All features
full = ["common", "xz", "macintosh", "amiga", "game", "dos", "next", "beos", "lisa"]
all = ["full"]

# WASM-compatible feature set
wasm = ["common", "xz", "amiga", "macintosh", "dos", "next", "beos", "lisa"]

[dependencies]
# Error handling
thiserror = { version = "2.0", default-features = false }

# Memory mapping
memmap2 = { version = "0.9", optional = true }

# Platform-specific
[target.'cfg(unix)'.dependencies]
xattr = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Fixture generator for tests only; the ZIP reader itself is native.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Fixture generators for tests and benches only; the GZIP and TAR readers are native.
flate2 = "1.0"
tar = "0.4"

[[bench]]
name = "traversal"
harness = false
required-features = ["std", "full"]
